name: Update website from PPT

on:
  push:
    paths:
      - "ppts/*.pptx"
      - "ppts/**/*.pptx"
      - "scripts/extract_pptx.py"
      - "scripts/check_new_names.py"
      - "scripts/compile_ipo_details.py"
      - "scripts/bundle_standalone.py"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: hk-cornerstone-data-update
  cancel-in-progress: false

jobs:
  update-data:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: "pip"

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Extract new PPT data
        run: python scripts/extract_pptx.py --incremental

      - name: Compile IPO detail placeholders
        run: python scripts/compile_ipo_details.py

      - name: Build standalone copy
        run: python scripts/bundle_standalone.py

      - name: Commit generated website data
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/data.json data/data.js data/.pptx_index.json \
                  data/ipo_details.json data/ipo_details.js \
                  hk_cornerstone_investors_standalone.html
          if git diff --cached --quiet; then
            echo "No generated changes to commit."
          else
            git commit -m "Auto-update website data from PPT"
            git push
          fi
