name: Update website from PPT

on:
  push:
    paths:
      - "ppts/*.pptx"
      - "ppts/**/*.pptx"
      - "scripts/extract_pptx.py"
      - "scripts/check_new_names.py"
      - "scripts/compile_ipo_details.py"
      - "scripts/bundle_standalone.py"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: hk-cornerstone-data-update
  cancel-in-progress: false

jobs:
  update-data:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: "pip"

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Extract new PPT data
        run: python scripts/extract_pptx.py --incremental

      - name: Compile IPO detail placeholders
        run: python scripts/compile_ipo_details.py

      - name: Build standalone copy
        run: python scripts/bundle_standalone.py

      - name: Commit generated website data
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add .
          git commit -m "Auto-update website data from PPT" || exit 0
          git pull --rebase origin main
          git push origin main
